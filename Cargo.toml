[package]
name = "Nano-Server"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
rustls-pemfile = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
debug = 0
panic = "abort"
