# Nano-Server configuration. Values are written without quotes.

[server]
address = 127.0.0.1:8080
cache_max_age_seconds = 3600
access_log = logs/access.log
# Enable HTTPS by setting both PEM files. When enabled, only TLS 1.3 is accepted.
# tls_cert = certs/fullchain.pem
# tls_key = certs/privkey.pem

[site localhost]
document_root = public
index_file = index.html
not_found_page = 404.html

[site demo.local]
document_root = public-demo
index_file = index.html
not_found_page = 404.html

# Redirects are matched by exact URL path on the selected host.
[redirect localhost]
/welcome = 302 /

# Override or add MIME types by file extension (without the dot).
[mime]
wasm = application/wasm
md = text/markdown; charset=utf-8
